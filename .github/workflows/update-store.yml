name: Update Store Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    if: "github.event.head_commit != null && !contains(github.event.head_commit.message, 'chore: bump version') && !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Plugin Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate and Update Version
        id: bump_version
        run: |
          python3 - << 'EOF'
          import json, re

          with open('manifest.json', 'r') as f:
              data = json.load(f)
          version = data.get('version', '1.0.0')

          try:
              parts = [int(p) for p in version.split('.')]
              if len(parts) == 3:
                  x, y, z = parts
                  if z < 10:
                      new_ver = f"{x}.{y}.{z+1}"
                  elif y < 9:
                      new_ver = f"{x}.{y+1}.0"
                  else:
                      new_ver = f"{x+1}.0.0"
              else:
                  new_ver = "1.0.1"
          except Exception:
              new_ver = "1.0.1"

          if version != new_ver:
              data['version'] = new_ver
              with open('manifest.json', 'w') as f:
                  json.dump(data, f, indent=4)
                  f.write('\n')
                  
              with open('main.py', 'r') as f:
                  content = f.read()
              content = re.sub(r'plugin_version\s*=\s*["\'][^\'"]+["\']', f'plugin_version="{new_ver}"', content)
              with open('main.py', 'w') as f:
                  f.write(content)
          EOF

          NEW_VER=$(python3 -c "import json; print(json.load(open('manifest.json')).get('version', '1.0.0'))")
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json main.py
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to $NEW_VER [skip ci]"
            git push origin main
          fi

          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check for Store Token Secret
        id: check_secret
        run: |
          if [ -n "${{ secrets.STORE_ACCESS_TOKEN }}" ] || [ -n "${{ secrets.STORE_AUTOMATION_TOKEN }}" ]; then
            echo "HAS_SECRET=true" >> $GITHUB_ENV
          else
            echo "HAS_SECRET=false" >> $GITHUB_ENV
            echo "::warning::STORE_ACCESS_TOKEN or STORE_AUTOMATION_TOKEN secret is not set in GitHub repository settings. Store repository update skipped."
          fi

      - name: Checkout Store Repository
        if: env.HAS_SECRET == 'true'
        uses: actions/checkout@v4
        with:
          repository: oparada1988/StreamController-Store
          token: ${{ secrets.STORE_ACCESS_TOKEN || secrets.STORE_AUTOMATION_TOKEN }}
          path: store
          ref: main

      - name: Update Plugins.json in Store
        if: env.HAS_SECRET == 'true'
        run: |
          cd store
          python3 - << 'EOF'
          import json, os

          new_version = os.environ.get('NEW_VERSION')
          commit_hash = os.environ.get('COMMIT_HASH')

          with open('Plugins.json', 'r') as f:
              data = json.load(f)

          found = False
          for plugin in data:
              if 'DiscordSC' in plugin.get('url', ''):
                  if 'commits' not in plugin or not isinstance(plugin['commits'], dict):
                      plugin['commits'] = {}
                  plugin['commits'][new_version] = commit_hash
                  found = True
                  break

          if not found:
              data.append({
                  "url": "https://github.com/oparada1988/DiscordSC",
                  "commits": {
                      new_version: commit_hash
                  }
              })

          with open('Plugins.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit and Push Changes to Store
        if: env.HAS_SECRET == 'true'
        run: |
          cd store
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plugins.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update DiscordSC to version ${{ env.NEW_VERSION }} (commit ${{ env.COMMIT_HASH }})"
            git push origin main
          fi
