name: Update Store Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    if: "github.event.head_commit != null && !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Plugin Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Version and Commit Hash
        id: bump_version
        run: |
          NEW_VER=$(python3 -c "import json; print(json.load(open('manifest.json')).get('version', '1.1.0'))")
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check for Store Token Secret
        id: check_secret
        run: |
          TOKEN="${{ secrets.STORE_ACCESS_TOKEN || secrets.STORE_AUTOMATION_TOKEN || secrets.STORE_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.STORE_REPO_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            echo "HAS_SECRET=true" >> $GITHUB_ENV
          else
            echo "HAS_SECRET=false" >> $GITHUB_ENV
            echo "::warning::Store access secret token is not set in GitHub repository settings. Store repository update skipped."
          fi

      - name: Checkout Store Repository
        if: env.HAS_SECRET == 'true'
        uses: actions/checkout@v4
        with:
          repository: oparada1988/StreamController-Store
          token: ${{ secrets.STORE_ACCESS_TOKEN || secrets.STORE_AUTOMATION_TOKEN || secrets.STORE_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.STORE_REPO_TOKEN }}
          path: store
          ref: main

      - name: Update Plugins.json in Store
        if: env.HAS_SECRET == 'true'
        run: |
          cd store
          python3 - << 'EOF'
          import json, os

          new_version = os.environ.get('NEW_VERSION')
          commit_hash = os.environ.get('COMMIT_HASH')

          with open('Plugins.json', 'r') as f:
              data = json.load(f)

          found = False
          for plugin in data:
              if 'DiscordSC' in plugin.get('url', ''):
                  plugin['commits'] = {new_version: commit_hash}
                  found = True
                  break

          if not found:
              data.append({
                  "url": "https://github.com/oparada1988/DiscordSC",
                  "commits": {
                      new_version: commit_hash
                  }
              })

          with open('Plugins.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit and Push Changes to Store
        if: env.HAS_SECRET == 'true'
        run: |
          cd store
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plugins.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update DiscordSC to version ${{ env.NEW_VERSION }} (commit ${{ env.COMMIT_HASH }})"
            git push origin main
          fi
